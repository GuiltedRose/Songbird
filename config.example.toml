# Linux: ~/.config/songbird/config.toml (or $XDG_CONFIG_HOME/songbird/config.toml)
# Windows: %APPDATA%\Songbird\config.toml
# macOS: ~/Library/Application Support/Songbird/config.toml
# SONGBIRD_CONFIG overrides the path on every platform.
# Save this file while Songbird is open: appearance reloads automatically.
version = 1

[appearance]
font_size = 14.0
editor_font_size = 15.0
window_width = 1120.0  # Initial size; restart to apply window dimensions.
window_height = 780.0
show_tracks = true
show_console = true

[theme]
base = "dark"        # "dark" or "light"; omitted colors inherit that base.
background = "#101615"
panel = "#1a2421"
text = "#e0ebe6"
muted = "#879a90"
accent = "#7de2be"
selection = "#315e4f"
keyword = "#70cdb5"
string = "#d1b878"
number = "#b69be6"
waveform = "#5fb9a0"
recording = "#ff7e86"

# Interface and singing defaults are independent; old banks keep their language.
[language]
interface = "auto"
project_default = "auto"
pronunciation_default = "auto"
# resources = "/absolute/path/to/resources"
# font_file = "/absolute/path/to/font.ttf"

[voicebank]
# Default for new singing selections; composition/project overrides take priority.
# "auto" follows project/interface language detection (English fallback).
default_language = "auto"
# Phoneme inventory/profile used to interpret singing sounds, not a device list.
# "auto" lets the chosen language select its inventory; existing banks are unchanged.
default_inventory = "auto"

[recording]
# Manual placement correction in milliseconds (-2000 to +2000).
# Positive moves the recorded clip earlier; measure with your hardware loopback.
latency_ms = 0.0
# Audible count-in bars before timeline capture (0..8); immediate Record ignores it.
count_in_bars = 1
# Arrangement bars played before the punch-in point (0..8), after count-in.
pre_roll_bars = 0
# Timeline playback click; not digitally mixed into recorded input.
metronome = false

[storage]
# Maximum regenerable decoded PCM cache, in bytes (4294967296 = 4 GiB).
# Source audio, recordings, projects, and voicebanks are never cache-evicted.
cache_bytes = 4294967296
# Keep this much disk space free (67108864 = 64 MiB); capture/decoding may refuse
# to start or continue when space is insufficient. This is not a cache size.
minimum_free_bytes = 67108864

[audio]
# Omit input/output for System Default. Exact CPAL names can also be set in the GUI.
# input = "USB Microphone"
# output = "Speakers"
channels = 1  # 1 = mono, 2 = stereo input; hardware must support the project rate.
format = "flac"  # "wav" or lossless "flac"; original capture WAV is preserved.
# Monitoring always starts OFF and is never persisted; no microphone starts here.
