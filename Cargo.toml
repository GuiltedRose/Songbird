[package]
name = "songbird"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Offline code-driven audio and singing workstation"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
hound = "3.5"
claxon = "0.4"
flacenc = { version = "0.5", default-features = false }
cpal = "0.16"
rtrb = "0.3"
md-5 = "0.10"
eframe = { version = "0.33", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
