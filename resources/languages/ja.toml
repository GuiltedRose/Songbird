version = 1
language = "ja"
name = "Japanese"
inventory = "ja-phones"
provider = "dictionary"
provider_version = "1"
license = "BSD-3-Clause; original Songbird starter resource"
attribution = "Songbird contributors; starter mappings, not a comprehensive pronunciation lexicon"
capabilities = ["manual", "dictionary", "literal-rules"]
scripts = ["Unicode"]
syllabification = "explicit"
tokenization = "dictionary"

[timing]
consonant_fraction = 0.35
consonant_max = 0.075
crossfade_ms = 4.0
allow_consonant_syllables = true

[dictionary]
"こんにちは" = "k o / N / n i / ch i / w a"
"世界" = "s e / k a / i"
"歌" = "u / t a"
"ありがとう" = "a / r i / g a / t o / u"
"あい" = "a / i"

